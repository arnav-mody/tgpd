  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script>
    // Leaderboard backend: the game's bundled code calls fetch("actions", ...)
    // expecting a backend that doesn't exist on static hosting. This shim
    // intercepts those specific calls and serves them from Firestore instead,
    // without touching the game bundle itself.
    (function () {
      var firebaseConfig = {
        apiKey: "AIzaSyCA84H14uxRrdhr-teA1XRTAng2shpwZt8",
        authDomain: "tgpd-ba3a7.firebaseapp.com",
        projectId: "tgpd-ba3a7",
        storageBucket: "tgpd-ba3a7.firebasestorage.app",
        messagingSenderId: "695053704803",
        appId: "1:695053704803:web:bd1f47391d009e98e06256"
      };
      firebase.initializeApp(firebaseConfig);
      var db = firebase.firestore();
      var LEADERBOARD_LIMIT = 500;

      var origFetch = window.fetch.bind(window);
      window.fetch = function (input, init) {
        if (input === "actions" && init && init.method === "POST") {
          var body = null;
          try { body = JSON.parse(init.body); } catch (e) {}

          if (body && body.action === "records.list" && body.args && body.args.collection === "scores") {
            return db.collection("scores").orderBy("timeSurvived", "desc").limit(LEADERBOARD_LIMIT).get()
              .then(function (snap) {
                var records = [];
                snap.forEach(function (doc) { records.push({ id: doc.id, value: doc.data() }); });
                return new Response(JSON.stringify({ data: { records: records } }), { status: 200, headers: { "content-type": "application/json" } });
              })
              .catch(function () {
                return new Response(JSON.stringify({ data: { records: [] } }), { status: 200, headers: { "content-type": "application/json" } });
              });
          }

          if (body && body.action === "records.create" && body.args && body.args.collection === "scores") {
            var value = body.args.value || {};
            return db.collection("scores").add(Object.assign({}, value, {
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            }))
              .then(function (docRef) {
                return new Response(JSON.stringify({ data: { record: { id: docRef.id, value: value } } }), { status: 200, headers: { "content-type": "application/json" } });
              })
              .catch(function (err) {
                return new Response(JSON.stringify({ error: String(err) }), { status: 500, headers: { "content-type": "application/json" } });

      };

      // Floating leaderboard-preview button (start screen only) and
      // home button (playing / game-over screens). Both are plain DOM
      // overlays outside the React tree, so they work regardless of the
      // game's internal state — visibility is driven by watching for the
      // "PLAY" button the game itself renders on its start screen.
      function isOnStartScreen() {
        var buttons = document.querySelectorAll("button");
        for (var i = 0; i < buttons.length; i++) {
          if (buttons[i].textContent.trim() === "PLAY") return true;
        }
        return false;
      }
      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      var lbBtn = document.createElement("button");
      lbBtn.textContent = "\u{1F3C6}";
      lbBtn.setAttribute("aria-label", "View leaderboard");
      lbBtn.style.cssText = "position:fixed;top:14px;right:14px;z-index:9999;width:44px;height:44px;border-radius:50%;background:#FFD84D;border:3px solid #000;box-shadow:3px 3px 0px #000;font-size:20px;cursor:pointer;display:none;align-items:center;justify-content:center;padding:0;";
      document.body.appendChild(lbBtn);

      var lbOverlay = document.createElement("div");
      lbOverlay.style.cssText = "position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.55);display:none;align-items:center;justify-content:center;padding:20px;";
      lbOverlay.innerHTML =
        '<div style="background:#FFF8E7;border:4px solid #000;border-radius:16px;box-shadow:6px 6px 0px #000;max-width:360px;width:100%;max-height:80vh;display:flex;flex-direction:column;overflow:hidden;font-family:ui-sans-serif,system-ui,sans-serif;">' +
          '<div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:3px solid #000;">' +
            '<span style="font-weight:900;font-size:14px;letter-spacing:0.05em;">LEADERBOARD</span>' +
            '<button id="tgpd-lb-close" style="background:none;border:none;font-size:20px;cursor:pointer;line-height:1;">&times;</button>' +
          "</div>" +
          '<div id="tgpd-lb-list" style="padding:12px 16px;overflow-y:auto;font-size:13px;">Loading...</div>' +
        "</div>";
      document.body.appendChild(lbOverlay);
      lbOverlay.addEventListener("click", function (e) { if (e.target === lbOverlay) lbOverlay.style.display = "none"; });
      lbOverlay.querySelector("#tgpd-lb-close").addEventListener("click", function () { lbOverlay.style.display = "none"; });

      lbBtn.addEventListener("click", function () {
        lbOverlay.style.display = "flex";
        var list = lbOverlay.querySelector("#tgpd-lb-list");
        list.textContent = "Loading...";
        db.collection("scores").orderBy("timeSurvived", "desc").limit(LEADERBOARD_LIMIT).get().then(function (snap) {
          if (snap.empty) { list.textContent = "No scores yet — be first!"; return; }
          var rows = [];
          var i = 0;
          snap.forEach(function (doc) {
            i++;
            var d = doc.data();
            rows.push(
              '<div style="display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid rgba(0,0,0,0.1);">' +
                '<span style="font-weight:700;">' + i + ". " + escapeHtml(d.name || "???") + "</span>" +
                "<span>" + (typeof d.timeSurvived === "number" ? d.timeSurvived.toFixed(1) : "0") + "s</span>" +
              "</div>"
            );
          });
          list.innerHTML = rows.join("");
        }).catch(function () {
          list.textContent = "Could not load leaderboard.";
        });
      });

      var homeBtn = document.createElement("button");
      homeBtn.textContent = "\u{1F3E0}";
      homeBtn.setAttribute("aria-label", "Back to start");
      homeBtn.style.cssText = "position:fixed;bottom:14px;left:14px;z-index:9999;width:44px;height:44px;border-radius:50%;background:#fff;border:3px solid #000;box-shadow:3px 3px 0px #000;font-size:20px;cursor:pointer;display:none;align-items:center;justify-content:center;padding:0;";
      homeBtn.addEventListener("click", function () { location.reload(); });
      document.body.appendChild(homeBtn);

      setInterval(function () {
        var start = isOnStartScreen();
        lbBtn.style.display = start ? "flex" : "none";
        homeBtn.style.display = start ? "none" : "flex";
        if (!start) lbOverlay.style.display = "none";
      }, 300);
    })();
  </script>
