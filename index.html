<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tanay's Ultimate Portfolio</title>
<meta name="description" content="A game built to help Tanay get ready for post-marriage life.">
<style>
  :root {
    --bg: #0b0b0c;
    --fg: #f2f0ec;
    --muted: #9a968c;
    --accent: #e8b24d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }
  .eyebrow {
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 14px;
  }
  h1 {
    font-size: clamp(2rem, 8vw, 3rem);
    margin: 0 0 14px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  p {
    color: var(--muted);
    font-size: 1.05rem;
    margin: 0;
  }
  a { color: var(--muted); }
</style>
</head>
<body>
<div>
  <p class="eyebrow">TGPD</p>
  <h1>Tanay's Ultimate Portfolio</h1>
  <p>A game built to help Tanay get ready for post-marriage life. In the works &mdash; <a href="https://arnavmody.com">arnavmody.com</a></p>
</div>
</body>
</html>
